[project]
name = "agent"
version = "0.4.2"
requires-python = ">=3.12,<3.14"
dependencies = [
  "ag-ui-langgraph>=0.0.36",
  "copilotkit>=0.1.93",
  "fastapi>=0.136.3",
  "langchain>=1.0",
  "langchain-core>=1.4.0",
  "langchain-mistralai>=1.1.6",
  "langgraph>=1.0",
  "python-dotenv>=1.2.2",
  "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "pypdf>=6.21.2",
    "pytest>=8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.uv]
required-version = ">=0.11"
exclude-newer = "7 days"
no-build = true
# Exemption ponctuelle d'un patch urgent (à retirer ensuite) :
# exclude-newer-package = { mon-paquet = false }

[tool.uv.audit]
malware-check = true
